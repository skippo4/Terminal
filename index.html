<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Removal Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --moniepoint-blue: #0A66C2;
  --danger-red: #e74c3c;
  --success-green: #28a745;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f9ff;
  margin: 0;
}

.form-container {
  max-width: 480px;
  margin: 40px auto;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(0,0,0,0.12);
}

.form-header {
  background: var(--moniepoint-blue);
  color: #fff;
  text-align: center;
  padding: 25px 20px;
}

.logo {
  width: 70px;
  margin-bottom: 10px;
}

form {
  padding: 20px;
}

input[type="email"],
input[type="text"] {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.serial-card {
  display: flex;
  gap: 8px;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  background: #f9f9f9;
  border: 1px solid #ccc;
  align-items: center;
}

.serial-card input {
  flex: 1;
}

.removeSerial {
  background: var(--danger-red);
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.add-btn {
  background: #e6f0ff;
  color: var(--moniepoint-blue);
  border: 1px solid var(--moniepoint-blue);
  padding: 10px;
  width: 100%;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 12px;
  font-weight: bold;
}

.checkbox-group {
  display: flex;
  gap: 8px;
  font-size: 14px;
  margin-bottom: 15px;
  align-items: center;
}

button[type="submit"] {
  width: 100%;
  padding: 12px;
  background: var(--moniepoint-blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

/* ===== SUCCESS ANIMATION ===== */
.success {
  display: none;
  padding: 40px 20px;
  text-align: center;
}

.checkmark {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--success-green);
  margin: 0 auto 15px;
  position: relative;
  animation: pop 0.6s ease;
}

.checkmark::after {
  content: '';
  position: absolute;
  left: 20px;
  top: 35px;
  width: 18px;
  height: 35px;
  border: solid #fff;
  border-width: 0 6px 6px 0;
  transform: rotate(45deg);
}

.success p {
  font-size: 18px;
  font-weight: bold;
  color: var(--success-green);
}

@keyframes pop {
  0% { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="form-container">
  <div class="form-header">
    <img src="logo.png" class="logo" alt="Logo" onerror="this.style.display='none'">
    <h2>Terminal Removal Request</h2>
    <p>Complete the Form</p>
  </div>

  <form id="removalForm">
    <input type="email" id="brmEmail" placeholder="BRM Official Email" required>
    <input type="text" id="brmName" placeholder="BRM Name" readonly>

    <div id="serialContainer">
      <div class="serial-card">
        <input type="text" class="serial" placeholder="Serial Number" required>
        <input type="text" class="repair" placeholder="Repair Code" required>
        <button type="button" class="removeSerial">X</button>
      </div>
    </div>

    <button type="button" class="add-btn" id="addSerialBtn">➕ Add Another Terminal</button>

    <div class="checkbox-group">
      <input type="checkbox" id="agree" required>
      <label for="agree">
        I agree that every terminal/terminals is/are with battery/batteries
      </label>
    </div>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <div class="success" id="successMsg">
    <div class="checkmark"></div>
    <p>Submission Successful</p>
    <small>Redirecting to WhatsApp…</small>
  </div>
</div>

<script>
const brmDirectory = {
  "opeyemi.obafemi@moniepoint.com": "Obafemi Opeyemi Adoga",
  "ismaila.gulloma@moniepoint.com": "GULLOMA ISMAILA MUSA",
  "mohammed.tukur@moniepoint.com": "MOHAMMED TUKUR",
  "ejimofor.jibeze@moniepoint.com": "JIBEZE EJIMOFOR MICHAEL",
  "kizito.ugwa@moniepoint.com": "UGWA KIZITO KENNEDY",
  "grace.ekwere@moniepoint.com": "EKWERE GRACE SIMEON",
  "cyprian.christopher@moniepoint.com": "CHRISTOPHER CYPRIAN ISIOMA",
  "alfred.edimeh@moniepoint.com": "EDIMEH ALFRED MUSA",
  "saminu.usman@moniepoint.com": "USMAN SAMINU",
  "taofeek.suleiman@moniepoint.com": "SULEIMAN TAOFEEK",
  "favour.nwobodo@moniepoint.com": "NWOBODO FAVOUR ANNABEL",
  "ridwan.abiola@moniepoint.com": "AWORINDE RIDWAN ABIOLA",
  "saidu.bala@moniepoint.com": "Haruna Habibu",
  "jibril.abdullahi@moniepoint.com": "ABDULLAHI JIBRIL",
  "godswill.charles@moniepoint.com": "Charles Godswill Francis",
  "rosemary.john@moniepoint.com": "JOHN Rosemary",
  "kabiru.adamu@moniepoint.com": "BALA Abdullahi"
};

const form = document.getElementById("removalForm");
const success = document.getElementById("successMsg");
const serialContainer = document.getElementById("serialContainer");
const submitBtn = document.getElementById("submitBtn");

brmEmail.addEventListener("input", () => {
  brmName.value = brmDirectory[brmEmail.value.toLowerCase()] || "";
});

addSerialBtn.onclick = () => {
  serialContainer.insertAdjacentHTML("beforeend", `
    <div class="serial-card">
      <input type="text" class="serial" placeholder="Serial Number" required>
      <input type="text" class="repair" placeholder="Repair Code" required>
      <button type="button" class="removeSerial">X</button>
    </div>
  `);
};

serialContainer.onclick = e => {
  if (e.target.classList.contains("removeSerial") &&
      document.querySelectorAll(".serial").length > 1) {
    e.target.parentElement.remove();
  }
};

form.onsubmit = async e => {
  e.preventDefault();
  submitBtn.disabled = true;

  const email = brmEmail.value.toLowerCase();
  if (!brmDirectory[email]) {
    alert("Invalid BRM email");
    submitBtn.disabled = false;
    return;
  }

  const serials = document.querySelectorAll(".serial");
  const repairs = document.querySelectorAll(".repair");

  for (let i = 0; i < serials.length; i++) {
    if (!serials[i].value.trim() || !repairs[i].value.trim()) {
      alert("All serials and repair codes are required");
      submitBtn.disabled = false;
      return;
    }
  }

  const data = {
    brmEmail: email,
    brmName: brmName.value,
    terminals: Array.from(serials).map((s, i) => ({
      serial: s.value.toUpperCase(),
      repairCode: repairs[i].value.toUpperCase()
    })),
    batteryConfirmed: agree.checked,
    timestamp: new Date().toLocaleString()
  };

  try {
    const res = await fetch(
      "https://script.google.com/macros/s/AKfycbzDy3qlALtQ33OlmeP3lQU_R8_eE-HRXSmgqGzgBPiRDa5TxQ_PAkzwUn8NdlOrTRecjw/exec",
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      }
    );

    const result = await res.json();
    if (!result.success) throw "Sheet error";

  } catch {
    alert("Submission failed. Try again.");
    submitBtn.disabled = false;
    return;
  }

  form.style.display = "none";
  success.style.display = "block";

  let terminalText = "";
  data.terminals.forEach(t => {
    terminalText += `• ${t.serial} (${t.repairCode})\n`;
  });

  const msg = encodeURIComponent(
`TERMINAL REMOVAL REQUEST

BRM: ${data.brmName}
Email: ${email}

TERMINALS:
${terminalText}

Battery Confirmed: ${data.batteryConfirmed ? "YES" : "NO"}`
  );

  setTimeout(() => {
    window.open(`https://wa.me/2348135341447?text=${msg}`, "_blank");
    location.reload();
  }, 2500);
};
</script>

</body>
</html>
